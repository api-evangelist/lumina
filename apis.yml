name: Lumina
description: >-
  Lumina (Lumina Innovations) is a San Francisco-based startup building
  all-electric, autonomous heavy construction equipment. Founded by Ahmed
  Shubber and Federico Di Palma, the company develops both the hardware and the
  self-driving software in-house, taking a Tesla/Waymo-style approach to the
  excavation and earth-moving industry. Its flagship Moonlander ML6 is a 32-ton
  fully autonomous electric bulldozer with roughly 750 horsepower of peak output
  and a 414 kWh battery pack. The broader product lineup spans Roadrunner,
  Moonlander, Bladerunner, and a Powerpack energy system. Lumina does not
  currently publish a public developer API, SDK, or developer portal; this
  profile tracks the company as a portfolio lead in the API Evangelist network.
